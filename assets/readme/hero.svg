<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">软路由分流助手</title>
  <desc id="desc">Windows 桌面端管理 OpenWrt 自定义域名规则；示意规则选择、预览备份、应用验证和失败恢复的流程。</desc>
  <rect width="1200" height="400" rx="28" fill="#f5f8f6"/>
  <rect x="1" y="1" width="1198" height="398" rx="27" fill="none" stroke="#dce9e1" stroke-width="2"/>
  <path d="M28 1h12v398H28c-15 0-27-12-27-27V28C1 13 13 1 28 1Z" fill="#157a56"/>

  <g id="identity" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <rect x="72" y="51" width="48" height="48" rx="13" fill="#157a56"/>
    <text x="96" y="84" fill="#ffffff" font-size="30" font-weight="700" text-anchor="middle">路</text>
    <text x="137" y="82" fill="#0e5f43" font-size="21" font-weight="700" letter-spacing="1.5">WINDOWS · OPENWRT</text>
    <text x="71" y="168" fill="#19332b" font-size="67" font-weight="750">软路由分流助手</text>
    <text x="74" y="218" fill="#526b60" font-size="27">看清域名规则，再安全地应用到路由器</text>
    <rect x="74" y="256" width="256" height="43" rx="20" fill="#dff3e9"/>
    <text x="202" y="284" fill="#0e5f43" font-size="20" font-weight="700" text-anchor="middle">v0.4.0 · 真机验收中</text>
    <text x="74" y="349" fill="#708078" font-size="20">OpenClash / Nikki · 自定义域名规则</text>
  </g>

  <g id="workflow" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <rect x="721" y="42" width="420" height="316" rx="22" fill="#ffffff" stroke="#d4e4db" stroke-width="2"/>
    <text x="751" y="89" fill="#19332b" font-size="24" font-weight="700">一次变更的流程</text>
    <text x="1113" y="89" fill="#829188" font-size="18" text-anchor="end">示意</text>
    <path d="M763 123v176" stroke="#bad9ca" stroke-width="4" stroke-linecap="round"/>

    <circle cx="763" cy="147" r="20" fill="#157a56"/>
    <text x="763" y="154" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">1</text>
    <text x="803" y="155" fill="#19332b" font-size="25" font-weight="700">选择助手规则</text>

    <circle cx="763" cy="211" r="20" fill="#157a56"/>
    <text x="763" y="218" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">2</text>
    <text x="803" y="219" fill="#19332b" font-size="25" font-weight="700">预览并备份</text>

    <circle cx="763" cy="275" r="20" fill="#157a56"/>
    <text x="763" y="282" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">3</text>
    <text x="803" y="283" fill="#19332b" font-size="25" font-weight="700">应用与验证</text>

    <text x="803" y="331" fill="#a76709" font-size="20" font-weight="700">失败时尝试恢复原配置</text>
  </g>
</svg>
